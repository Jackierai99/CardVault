name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q -o ./*.zip -d work
          P=$(dirname "$(find work -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$P" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build debug + release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CardVault-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
